{{ define "main" }}
<div class="page-hero">
  <div class="wrap">
    <div class="inner">
      <span class="eyebrow">{{ .Params.eyebrow | default site.Title }}</span>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<div class="lede">{{ . }}</div>{{ end }}
    </div>
  </div>
</div>

<div class="wrap">
  <div class="art-wrap" style="grid-template-columns:1fr">
    <article class="art-body">
      {{ .Content }}
    </article>
  </div>
</div>
{{ end }}
