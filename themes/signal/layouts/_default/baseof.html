<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "ru" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ block "bodyclass" . }}{{ end }}">
  {{ block "progress" . }}{{ end }}
  <a class="skip" href="#main">К содержанию</a>
  {{ partial "header.html" . }}
  <main id="main" tabindex="-1">
  {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/signal.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
