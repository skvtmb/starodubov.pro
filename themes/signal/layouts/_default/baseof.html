<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "ru" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ block "bodyclass" . }}{{ end }}">
  {{ block "progress" . }}{{ end }}
  {{ partial "header.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/signal.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
