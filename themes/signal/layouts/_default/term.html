{{ define "main" }}
<div class="page-hero">
  <div class="wrap">
    <div class="inner">
      <h1>{{ if eq .Data.Singular "tag" }}#{{ end }}{{ .Title }}</h1>
      <div class="lede">{{ len .Pages }} материал(ов) по теме.</div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="list-wrap">
    {{ $paginator := .Paginate .Pages }}
    <h2 class="sr-only">Публикации</h2>
    <div class="post-grid">
      {{ range $paginator.Pages }}{{ partial "post-card.html" . }}{{ end }}
    </div>
    {{ partial "pager.html" $paginator }}
  </div>
</div>
{{ end }}
