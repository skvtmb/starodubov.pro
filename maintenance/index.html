<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Константин Стародубов — сайт в разработке</title>
<style>
:root{--bg:#0a0a0b;--bg2:#121214;--line:#26262a;--ink:#f2f2f0;--muted:#9b9b97;--acc:#4ef07a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px;
background-image:repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,255,255,.012) 14px 15px)}
.card{max-width:560px;width:100%;border:1px solid var(--line);border-radius:18px;background:var(--bg2);padding:48px 44px;text-align:center;position:relative}
.corner{position:absolute;width:14px;height:14px;border:2px solid var(--acc)}
.tl{top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.br{bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 18px 0}
.mark{display:inline-grid;place-items:center;width:64px;height:64px;border:2px solid var(--acc);border-radius:14px;color:var(--acc);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:24px;font-weight:700;margin-bottom:28px}
.tag{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);display:block;margin-bottom:14px}
h1{font-size:32px;font-weight:650;letter-spacing:-.02em;margin-bottom:14px}
p{color:var(--muted);font-size:16px;line-height:1.65;margin-bottom:30px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:9px;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
a.mail{display:inline-block;border:1px solid var(--line);border-radius:11px;padding:13px 22px;color:var(--ink);text-decoration:none;font-size:15px;transition:border-color .15s,color .15s}
a.mail:hover{border-color:var(--acc);color:var(--acc)}
.foot{margin-top:34px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;color:var(--muted);letter-spacing:.08em}
</style>
</head>
<body>
<div class="card">
  <span class="corner tl"></span><span class="corner br"></span>
  <div class="mark">КС</div>
  <span class="tag"><span class="dot"></span>сайт в разработке</span>
  <h1>Константин Стародубов</h1>
  <p>Здесь скоро откроется обновлённый сайт: информационная безопасность, комплаенс и технологии идентификации. Загляните чуть позже.</p>
  <a class="mail" href="mailto:xaku68@gmail.com">Написать мне →</a>
  <div class="foot">starodubov.pro · Москва · ИБ &amp; идентификация</div>
</div>
</body>
</html>
