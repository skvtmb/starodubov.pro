    name: "Nord"
    order: 5
  sunset:
    name: "Sunset"
    order: 6
  abyss:
    name: "Abyss"
    order: 7
  dracula:
    name: "Dracula"
    order: 8
  amethyst:
    name: "Amethyst"
    order: 9
  slate:
    name: "Slate"
    order: 10
  twitter:
    name: "Twitter"
    order: 11

# Home page configuration
home:
  recentPostsCount: 3  # На главной показываем 3 свежих, остальное на /posts/

  # Vcard-структура главной:
  #   vcard-hero    — портрет + имя + роль + CTA
  #   page-content  — описание из content/_index.md
  #   services      — 5 карточек "Чем могу помочь"
  #   section-tiles — быстрый доступ к /posts /now /categories /tags
  #   recent-posts  — 3 последних поста
  contentOrder:
    - vcard-hero
    - page-content
    - services
    - section-tiles
    - recent-posts




# Post configuration
post:
  showRelated: true           # show related posts
  relatedPostsCount: 3        # posts number
  license:
    show: false
    author: "Константин Стародубов"
    name: "CC BY-NC-SA 4.0"
    description: "Это произведение лицензировано по лицензии Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International. Указывайте источник, используйте не в коммерческих целях и сохраняйте ту же лицензию."
    url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
    displayName: "CC BY-NC-SA 4.0"

