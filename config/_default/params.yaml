  title: "Руководитель комплаенса информационной безопасности в финтехе"
  description: "Кандидат технических наук. Живу в Москве. Моя профессиональная область — информационная безопасность и технологии идентификации. Ранее работал в Банке России. Сейчас работаю в Яндексе. В фокусе моих интересов — то, как выстраивать и проверять требования ИБ в продуктовых и инфраструктурных системах, как применять практики и стандарты так, чтобы они действительно повышали уровень защиты и не тормозили развитие. Вне работы моё главное хобби — фотография."
  avatar: "/images/avatar.svg"
  social:
    - name: "ВКонтакте"
      url: "https://vk.com/xakuorg"
      icon: "vk"
    - name: "Телеграм"
      url: "https://t.me/SKWTMB"
      icon: "telegram"
    - name: "Email"
      url: "mailto:xaku68@gmail.com"
      icon: "email"
    - name: "НИУ ВШЭ"
      url: "https://www.hse.ru/staff/STARODUBOV/"
      icon: "library"

# Header configuration (modularized)
header:
  sticky: true  # Enable sticky navigation bar
  logo:
    image: "/images/tree-logo.png"  # Logo path relative to static folder, leave empty to use site title first letter
    link: "/"  # Click to home page
  # UI Components Control (header controls)
  showThemeSwitch: true      # Set to false to hide theme style switcher (palette icon)
  showDarkModeSwitch: true   # Set to false to hide dark mode switcher (sun/moon icon)
  showLanguageSwitch: true   # Set to false to hide language switcher
  languageSwitchMode: "dropdown"  # Language switch mode: "dropdown" (show panel) or "cycle" (direct cycle)

# Dock display mode
# Options: "scroll" (show on scroll up), "always" (always visible), "float" (floating button)
dock: "scroll"

# TOC (Table of Contents)
toc:
  enabled: true         # Enable or disable TOC globally
  position: "left"      # Options: card left right
  maxWidth: "280px"
  maxHeight: "80vh"

# Series (Document Series Navigation)
series:
  enabled: true         # Enable or disable Series globally
  position: "right"     # Options: card left right
  maxWidth: "280px"
  maxHeight: "80vh"
  showProgress: true    # Show reading progress (e.g., "2/5")
  showInHeader: true    # Show series info card in article header



# Default color scheme
colorScheme: "claude"
themes:
  default:
    name: "Default"
    order: 1
  claude:
    name: "Claude"
    order: 2
  bumblebee:
    name: "Bumblebee"
    order: 3
  emerald:
    name: "Emerald"
    order: 4
