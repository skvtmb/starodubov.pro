baseURL: https://starodubov.pro/
defaultContentLanguage: ru
title: Константин Стародубов
theme: signal
enableEmoji: true

# Посты датированы 2026 годом — без этого они не попадут в сборку
buildFuture: true

# Честный lastmod из истории git (для sitemap и RSS)
enableGitInfo: true

# Абсолютные URL для Yandex Object Storage
canonifyURLs: true
relativeURLs: false

permalinks:
  posts: /:slug/

pagination:
  pagerSize: 9

taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 2
    ordered: false
  highlight:
    codeFences: true
    noClasses: false
    style: github
    tabWidth: 2
