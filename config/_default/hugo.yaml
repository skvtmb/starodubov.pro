baseURL: https://starodubov.pro/
defaultContentLanguage: ru
title: Константин Стародубов
theme: signal
enableEmoji: true

# Названия рубрик и тегов: заглавная только первая буква («Информационная безопасность»)
titleCaseStyle: firstupper

# Посты датированы 2026 годом — без этого они не попадут в сборку
buildFuture: true

# Честный lastmod из истории git (для sitemap и RSS)
enableGitInfo: true

# Абсолютные URL для Yandex Object Storage
canonifyURLs: true
relativeURLs: false

permalinks:
  posts: /:slug/
  fotografiya: /фото/:slug/

pagination:
  pagerSize: 9

# Списки всех рубрик и всех тегов заменены одной страницей «Темы» (content/temy.md)
disableKinds: ["taxonomy"]

taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 2
    ordered: false
  highlight:
    codeFences: true
    noClasses: false
    style: github
    tabWidth: 2

# Индекс для поиска по сайту: /search.json (шаблон themes/signal/layouts/index.searchindex.json)
outputFormats:
  SearchIndex:
    mediaType: application/json
    baseName: search
    isPlainText: true
    notAlternative: true
outputs:
  home: ["HTML", "RSS", "SearchIndex"]
