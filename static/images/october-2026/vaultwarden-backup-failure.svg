<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1030" viewBox="0 0 800 1030" role="img" aria-labelledby="title desc" lang="ru">
<title id="title">Почему отказ резервного диска оставил Vaultwarden выключенным</title>
<desc id="desc">В 02:45 скрипт остановил Vaultwarden. В finally удаление частичного архива на недоступном BackUP завершилось ошибкой, поэтому последующий запуск контейнера не выполнился. Панель возвращала HTTP 502, хотя app.query показывал RUNNING. После исправления место назначения проверяется до остановки, а запуск выполняется во вложенном finally.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="800" height="1030" rx="24" fill="#101513"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
<text x="40" y="60" font-size="35" fill="#f1f5ef" font-weight="650" text-anchor="start">Как бэкап остановил Vaultwarden</text><text x="40" y="98" font-size="23" fill="#b1bdb3" font-weight="400" text-anchor="start">Цепочка ошибки · 30 октября 2026</text><rect x="40" y="140" width="720" height="100" rx="18" fill="#18211c" stroke="#34483b" stroke-width="2"/><text x="64" y="182" font-size="27" fill="#f1f5ef" font-weight="600" text-anchor="start">02:45 · скрипт останавливает контейнер</text><text x="64" y="217" font-size="22" fill="#b1bdb3" font-weight="400" text-anchor="start">Начинается согласованное резервирование</text><path d="M400 240 V285" fill="none" stroke="#f1cc7e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="285" width="720" height="100" rx="18" fill="#18211c" stroke="#f1cc7e" stroke-width="2"/><text x="64" y="327" font-size="27" fill="#f1f5ef" font-weight="600" text-anchor="start">Очистка частичного архива в finally</text><text x="64" y="362" font-size="22" fill="#b1bdb3" font-weight="400" text-anchor="start">Файл находится на недоступном BackUP</text><path d="M400 385 V430" fill="none" stroke="#ff9b90" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="430" width="720" height="100" rx="18" fill="#18211c" stroke="#ff9b90" stroke-width="2"/><text x="64" y="472" font-size="27" fill="#f1f5ef" font-weight="600" text-anchor="start">Удаление файла завершается ошибкой</text><text x="64" y="507" font-size="22" fill="#b1bdb3" font-weight="400" text-anchor="start">Выполнение не доходит до команды запуска</text><path d="M400 530 V575" fill="none" stroke="#ff9b90" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="575" width="720" height="100" rx="18" fill="#18211c" stroke="#ff9b90" stroke-width="2"/><text x="64" y="617" font-size="27" fill="#f1f5ef" font-weight="600" text-anchor="start">Vaultwarden остаётся выключенным</text><text x="64" y="652" font-size="22" fill="#b1bdb3" font-weight="400" text-anchor="start">Панель: HTTP 502 · app.query: RUNNING</text><rect x="40" y="730" width="720" height="250" rx="18" fill="#18211c" stroke="#7de4a0" stroke-width="2"/><text x="68" y="777" font-size="32" fill="#7de4a0" font-weight="650" text-anchor="start">После исправления</text><text x="68" y="824" font-size="27" fill="#f1f5ef" font-weight="400" text-anchor="start">До остановки: проверить пул</text><text x="68" y="860" font-size="27" fill="#f1f5ef" font-weight="400" text-anchor="start">и пробную запись с fsync.</text><text x="68" y="913" font-size="27" fill="#f1f5ef" font-weight="400" text-anchor="start">Запуск контейнера: во вложенном finally,</text><text x="68" y="949" font-size="27" fill="#f1f5ef" font-weight="400" text-anchor="start">даже если очистка завершилась ошибкой.</text>
</g></svg>