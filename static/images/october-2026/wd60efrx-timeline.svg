<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1070" viewBox="0 0 800 1070" role="img" aria-labelledby="title desc" lang="ru">
<title id="title">Рост SMART 5 и хронология отказа WD60EFRX</title>
<desc id="desc">SMART 5: 243 на 24 октября, 296 на 25 и 26 октября. На 26 октября SMART ещё показывал PASSED, ZFS ONLINE. 29 октября в 20:42 возникли ошибки идентификации и UAS. 30 октября в 01:30 невосстановимые ошибки чтения перевели пул в SUSPENDED. 31 октября завершено отсоединение пула. 296 не является универсальным порогом отказа.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="800" height="1070" rx="24" fill="#101513"/>
