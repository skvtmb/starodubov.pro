0" y="589" font-size="25" fill="#f1f5ef" font-weight="400" text-anchor="start">Зависла ATA-идентификация.</text><text x="100" y="624" font-size="25" fill="#b1bdb3" font-weight="400" text-anchor="start">UAS-ошибки, сброс USB-подключения.</text><circle cx="68" cy="700" r="9" fill="#ff9b90"/><text x="100" y="701" font-size="28" fill="#ff9b90" font-weight="600" text-anchor="start">30 октября · 01:30</text><text x="100" y="739" font-size="25" fill="#f1f5ef" font-weight="400" text-anchor="start">Невосстановимые ошибки чтения.</text><text x="100" y="774" font-size="25" fill="#ff9b90" font-weight="400" text-anchor="start">BackUP переходит в SUSPENDED.</text><circle cx="68" cy="850" r="9" fill="#b1bdb3"/><text x="100" y="851" font-size="28" fill="#f1f5ef" font-weight="600" text-anchor="start">31 октября</text><text x="100" y="889" font-size="25" fill="#f1f5ef" font-weight="400" text-anchor="start">Пул отсоединён от TrueNAS.</text><text x="100" y="924" font-size="25" fill="#b1bdb3" font-weight="400" text-anchor="start">Рабочие пулы снова проверены.</text><rect x="40" y="970" width="720" height="70" rx="18" fill="#101513" stroke="#34483b" stroke-width="2"/><text x="400" y="1014" font-size="25" fill="#b1bdb3" font-weight="400" text-anchor="middle">296 не является универсальным порогом отказа.</text>
