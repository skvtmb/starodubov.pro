<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1020" viewBox="0 0 800 1020" role="img" aria-labelledby="title desc" lang="ru">
<title id="title">Доступ к OpenClaw и пять специалистов</title>
<desc id="desc">Браузер подключается через центральный Nginx и Nginx в Debian VM к Gateway. Telegram подключён к тому же Gateway. Gateway обращается к Luna и Sol и передаёт задания пяти специалистам по очереди. Профили используют общий Gateway.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="800" height="1020" rx="24" fill="#101513"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
