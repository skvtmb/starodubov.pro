600" text-anchor="start">Модели Luna / Sol</text><text x="444" y="507" font-size="22" fill="#b1bdb3" font-weight="400" text-anchor="start">Общий аккаунт OpenAI</text><path d="M210 530 V590" fill="none" stroke="#7de4a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M760 190 H780 V640 H760" fill="none" stroke="#7de4a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="590" width="720" height="130" rx="18" fill="#18211c" stroke="#7de4a0" stroke-width="2"/><text x="68" y="635" font-size="32" fill="#7de4a0" font-weight="650" text-anchor="start">Gateway · main</text><text x="68" y="675" font-size="25" fill="#b1bdb3" font-weight="400" text-anchor="start">В Debian VM · 127.0.0.1:18790</text><path d="M590 590 V530" fill="none" stroke="#7de4a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M400 720 V780" fill="none" stroke="#7de4a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="780" width="720" height="140" rx="18" fill="#18211c" stroke="#34483b" stroke-width="2"/><text x="68" y="825" font-size="30" fill="#f1f5ef" font-weight="600" text-anchor="start">Пять специалистов</text><text x="68" y="863" font-size="26" fill="#7de4a0" font-weight="400" text-anchor="start">admin · researcher · developer</text><text x="68" y="898" font-size="26" fill="#7de4a0" font-weight="400" text-anchor="start">editor · planner</text><text x="40" y="965" font-size="25" fill="#b1bdb3" font-weight="400" text-anchor="start">По очереди, без вложенного делегирования.</text><text x="40" y="1000" font-size="23" fill="#b1bdb3" font-weight="400" text-anchor="start">Общий Gateway; профили не изолированы отдельными VM.</text>
