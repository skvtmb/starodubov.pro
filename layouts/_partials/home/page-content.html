{{/* About: bio из content/_index.md как обычный prose-блок, без announcement-стиля */}}
{{ if .Content }}
<section class="about-section mb-16">
  <div class="prose dark:prose-invert max-w-none
              prose-headings:font-semibold prose-headings:tracking-tight
              prose-h2:text-2xl md:prose-h2:text-3xl prose-h2:mb-6 prose-h2:mt-0 prose-h2:flex prose-h2:items-center prose-h2:gap-3
              prose-p:text-foreground prose-p:leading-relaxed prose-p:text-base md:prose-p:text-lg
              prose-a:text-primary prose-a:no-underline hover:prose-a:underline prose-a:underline-offset-2
              prose-strong:text-foreground prose-strong:font-semibold
              prose-em:text-foreground/90">
    {{ .Content }}
  </div>
</section>
{{ end }}
